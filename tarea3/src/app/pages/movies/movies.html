<section class="page">
  <header class="page-header">
    <h1>Catálogo de películas</h1>
    <p>Busca por título, director, productor, género o año y guarda tus favoritas.</p>
  </header>

  <app-movie-filters
    [genres]="genres"
    [years]="years"
    [resultCount]="movies().length"
    [total]="total"
    (filterChange)="onFilterChange($event)"
  />

  @if (movies().length) {
    <div class="grid">
      @for (movie of movies(); track movie.id) {
        <app-movie-card
          [movie]="movie"
          [isFavorite]="favoritesService.isFavorite(movie.id)"
          (favoriteToggle)="onFavoriteToggle($event)"
        />
      }
    </div>
  } @else {
    <div class="empty">
      <p>No encontramos películas con esos filtros.</p>
    </div>
  }
</section>
